[project]
name = "real-time-charts-with-flask"
version = "0.6.3"
description = "Sample application for the blog Creating Real-Time Charts with Flask"
authors = [
    { name = "Ronie Martinez", email = "ronmarti18@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.3",
    "gevent>=24.2.1",
    "gunicorn>=23.0.0",
]

[project.urls]
repository = "https://github.com/roniemartinez/real-time-charts-with-flask"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "ruff>=0.16.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E203"]

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
